services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brilliant
      POSTGRES_USER: brilliant
      POSTGRES_PASSWORD: brilliant_local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brilliant -d brilliant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
